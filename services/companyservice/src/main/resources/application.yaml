
# Application Configuration

# Server Configuration
server:
  port: ${COMPANY_SERVICE_PORT:8082}

spring:
  application:
    name: companyservice

  cloud:
    config:
      enabled: false

  # PostgreSQL Database Configuration
  datasource:
    url: ${COMPANY_DB_URL:jdbc:postgresql://localhost:5432/company_service_db}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  #jackson serializer
  jackson:
    deserialization:
      fail-on-unknown-properties: true

  # JPA / Hibernate Configuration
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# JWT Security Configuration
app:
  security:
    public-endpoints:
      - /api/v1/auth/signup
      - /api/v1/auth/login

    jwt:
      issuer: smart-job-portal
      public-key-path: ${JWT_PUBLIC_KEY_PATH:${user.home}/.smart-job-portal/keys/public.pem}

# Eureka Discovery Client
eureka:
  client:
    enabled: false

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

# Logging Configuration
logging:
  level:
    root: INFO
    com.kaveks.companyservice: INFO
    org.springframework.security: INFO