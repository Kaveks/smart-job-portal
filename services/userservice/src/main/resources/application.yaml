
# Application Configuration

# Server Configuration
server:
  port: ${USER_SERVICE_PORT:8081}

spring:
  application:
    name: userservice

  cloud:
    config:
      enabled: false

  # PostgreSQL Database Configuration
  datasource:
    url: ${USER_DB_URL:jdbc:postgresql://localhost:5432/user_service_db}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  #jackson serializer
  jackson:
    deserialization:
      fail-on-unknown-properties: true

  # JPA / Hibernate Configuration
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true

# JWT Security Configuration
app:
  security:
    public-endpoints:
      - /api/v1/auth/signup
      - /api/v1/auth/login

    jwt:
      issuer: smart-job-portal
      access-token-ttl: PT15M

      # Persistent RSA key storage directory
      key-directory: ${JWT_KEY_DIRECTORY:${user.home}/.smart-job-portal/keys}

      private-key-path: ${JWT_PRIVATE_KEY_PATH:${app.security.jwt.key-directory}/private.pem}
      public-key-path: ${JWT_PUBLIC_KEY_PATH:${app.security.jwt.key-directory}/public.pem}

# Eureka Discovery Client
eureka:
  client:
    enabled: false

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

# Logging Configuration
logging:
  level:
    root: INFO
    com.kaveks.userservice: INFO
    org.springframework.security: INFO